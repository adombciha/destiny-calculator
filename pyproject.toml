[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "destiny-calculator"
version = "0.1.0"
description = "Chinese and Western astrology charts with a local Streamlit interface."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = ["lunar-python==1.4.8", "izthon==0.2.0"]

[project.optional-dependencies]
ui = ["streamlit==1.66.1"]
western = ["pyswisseph==2.10.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
destiny_calculator = ["data/*.json"]
